[project]
name = "echotrack"
version = "0.1.0"
description = "Real-time JAX-based deepfake speech trajectory tracker"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Antipositive", email = "36bes36@mail.ru"}
]

dependencies = [
    "jax[cpu]",
    "flax",
    "optax",
    "sounddevice",
    "numpy",
    "scipy",
    "matplotlib",
    "tqdm",
    "datasets",
    "soundfile",
    "librosa",
    "orbax-checkpoint<=0.11.32",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "ruff",
    "pre-commit",
]
