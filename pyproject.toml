[project]
name = "echotrack"
version = "0.1.0"
description = "Real-time JAX-based deepfake speech trajectory tracker"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "jax[cpu]",                  # change to jax[cuda12_pip] or jax[tpu] when needed
    "flax",
    "optax",
    "sounddevice",
    "numpy",
    "scipy",
    "matplotlib",
    "tqdm",
    "datasets",                  # for Hugging Face ASVspoof 5
    "soundfile",
    "librosa",                   # optional for quick feature checks
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "ruff",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["echotrack*"]

[tool.uv]
dev-dependencies = ["echotrack[dev]"]
